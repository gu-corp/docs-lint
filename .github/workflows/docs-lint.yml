name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'packs/**'
      - 'schemas/**'
      - 'docs-lint.config.json'
      - 'src/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'packs/**'
      - 'schemas/**'
      - 'docs-lint.config.json'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node dist/cli.js lint --json
      - run: node dist/cli.js pack validate packs/gu-corp-software --json
